name: "Ontologie d'une fonction : valider, modifier, nouveau terme"
description: "Valider les termes GO/TO/ECOCORE/RO d'une fonction, en proposer d'autres, une définition, ou demander un terme manquant"
title: "[ontologie] "
labels: ["ontologie"]
body:
  - type: input
    id: fonction
    attributes: {label: "Fonction écologique de l'atlas"}
    validations: {required: true}
  - type: dropdown
    id: decision
    attributes:
      label: "Décision"
      options: ["Correspondance validée / Mapping validated", "Modifier la correspondance / Change the mapping", "Nouveau terme nécessaire / New term needed", "Nouvelle définition / New definition", "Scinder ou regrouper des fonctions / Split or merge functions"]
    validations: {required: true}
  - type: textarea
    id: termes
    attributes: {label: "Termes actuels (prérempli : prédicat SKOS, identifiant, libellé)"}
  - type: textarea
    id: proposition
    attributes: {label: "Proposition", description: "Autre terme (identifiant OBO), nouvelle définition, ou libellé + définition du terme à créer et ontologie cible (GO, TO, ECOCORE, RO…)"}
  - type: textarea
    id: commentaire
    attributes: {label: "Commentaire / lacune signalée"}
  - type: input
    id: orcid
    attributes: {label: "ORCID du curateur", placeholder: "0000-0000-0000-0000"}
    validations: {required: true}
