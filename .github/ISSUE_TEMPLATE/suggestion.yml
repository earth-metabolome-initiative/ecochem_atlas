name: "Suggest another function for a link"
description: "The publication supports a different function (existing or new) than the one in the atlas"
title: "[other function] "
labels: ["function-suggestion"]
body:
  - type: input
    id: paire
    attributes: {label: "Current pair (class → function)"}
    validations: {required: true}
  - type: textarea
    id: lien
    attributes: {label: "Link, supporting sentence and reference (prefilled)"}
  - type: input
    id: proposition
    attributes: {label: "Suggested function", description: "A function from the list, or 'New function: name + definition'"}
    validations: {required: true}
  - type: textarea
    id: justification
    attributes: {label: "Justification (what the publication actually measured)"}
    validations: {required: true}
  - type: input
    id: orcid
    attributes: {label: "Curator ORCID", placeholder: "0000-0000-0000-0000"}
    validations: {required: true}
