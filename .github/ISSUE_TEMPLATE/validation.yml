name: "Validate a molecule → function link"
description: "Confirm that an atlas link is supported by the cited publication"
title: "[validation] "
labels: ["validation"]
body:
  - type: input
    id: paire
    attributes: {label: "Pair (class → function)"}
    validations: {required: true}
  - type: textarea
    id: lien
    attributes: {label: "Link, supporting sentence and reference (prefilled by the atlas)"}
  - type: textarea
    id: termes
    attributes: {label: "Ontology terms mapped to the function"}
  - type: input
    id: orcid
    attributes: {label: "Curator ORCID", placeholder: "0000-0000-0000-0000"}
    validations: {required: true}
  - type: textarea
    id: commentaire
    attributes: {label: "Comment (optional)"}
