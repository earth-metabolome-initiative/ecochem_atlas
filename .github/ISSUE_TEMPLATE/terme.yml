name: "Function ontology: validate, change, request a new term"
description: "Validate the GO/TO/ECOCORE/RO terms of a function, suggest others or a definition, or request a missing term"
title: "[ontology] "
labels: ["ontology"]
body:
  - type: input
    id: fonction
    attributes: {label: "Atlas ecological function"}
    validations: {required: true}
  - type: dropdown
    id: decision
    attributes:
      label: "Decision"
      options: ["Mapping validated", "Change the mapping", "New term needed", "New definition", "Split or merge functions"]
    validations: {required: true}
  - type: textarea
    id: termes
    attributes: {label: "Current terms (prefilled: SKOS predicate, identifier, label)"}
  - type: textarea
    id: proposition
    attributes: {label: "Proposal", description: "Another term (OBO identifier), a new definition, or label + definition of the term to create and target ontology (GO, TO, ECOCORE, RO…)"}
  - type: textarea
    id: commentaire
    attributes: {label: "Comment / gap reported"}
  - type: input
    id: orcid
    attributes: {label: "Curator ORCID", placeholder: "0000-0000-0000-0000"}
    validations: {required: true}
